<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>智座星野 - 学生注册</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        .auth-container {
            max-width: 420px;
            margin: 2rem auto 1rem;
            padding: 0 1rem;
        }
        .auth-card {
            background: white;
            padding: 1.8rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .auth-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1.2rem;
        }
        .btn-auth {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.8rem;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
            margin-bottom: 0.8rem;
            transition: all 0.3s;
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.88rem;
            color: #718096;
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body style="padding-bottom: 20px;">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-title">🎓 新用户注册</div>

            <div class="form-group-mobile">
                <label>学号 / 用户名</label>
                <input type="text" id="username" class="form-control-mobile" placeholder="4-20位字母/数字/下划线" maxlength="20" />
            </div>

            <div class="form-group-mobile">
                <label>姓名</label>
                <input type="text" id="nickname" class="form-control-mobile" placeholder="真实姓名（预约展示）" maxlength="20" />
            </div>

            <div class="form-group-mobile">
                <label>设置密码</label>
                <input type="password" id="password" class="form-control-mobile" placeholder="至少6位密码" maxlength="30" />
                <div class="strength-bar" id="strength-bar" style="background:#eee;"></div>
            </div>

            <div class="form-group-mobile">
                <label>确认密码</label>
                <input type="password" id="password2" class="form-control-mobile" placeholder="请再次确认输入密码" maxlength="30" />
            </div>

            <button class="btn-auth" id="register-btn">✅ 立即提交注册</button>
            <p id="msg" style="text-align:center; min-height:1.2rem; font-size:0.85rem; margin-top:0.8rem;"></p>
            
            <div class="auth-footer">
                已有账号？<a href="/login">直接登录</a>
            </div>
        </div>
    </div>
    <script src="/static/register.js"></script>
</body>
</html>
